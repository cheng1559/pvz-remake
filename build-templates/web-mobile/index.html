<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />

        <title>Plants vs. Zombies</title>
        <link rel="icon" href="game.ico" />
        <!-- Lets Android Chrome install the game as a fullscreen landscape app, not only a browser shortcut. -->
        <link rel="manifest" href="manifest.webmanifest" />
        <meta name="theme-color" content="#000000" />

        <!--http://www.html5rocks.com/en/mobile/mobifying/-->
        <meta
            name="viewport"
            content="width=device-width,user-scalable=no,initial-scale=1,minimum-scale=1,maximum-scale=1,viewport-fit=cover"
        />

        <!--https://developer.apple.com/library/safari/documentation/AppleApplications/Reference/SafariHTMLRef/Articles/MetaTags.html-->
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
        <meta name="format-detection" content="telephone=no" />

        <!-- force webkit on 360 -->
        <meta name="renderer" content="webkit" />
        <meta name="force-rendering" content="webkit" />
        <!-- force edge on IE -->
        <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
        <meta name="msapplication-tap-highlight" content="no" />

        <!-- force full screen on some browser -->
        <meta name="full-screen" content="yes" />
        <meta name="x5-fullscreen" content="true" />
        <meta name="360-fullscreen" content="true" />

        <!--fix fireball/issues/3568 -->
        <!--<meta name="browsermode" content="application">-->
        <meta name="x5-page-mode" content="app" />

        <link rel="apple-touch-icon" href="apple-touch-icon.png" />

        <link rel="stylesheet" type="text/css" href="style.css" />
        <style>
            html, body {
                overflow: hidden;
                /* Unlike hidden, clip cannot be scrolled even by the browser: while Cocos rotates the frame, its
                   layout box overflows sideways and iOS would scroll it the first time the keyboard opens. */
                overflow: clip;
                overscroll-behavior: none;
            }

            #GameCanvas {
                touch-action: none;
            }

            /* iOS home screen apps with a translucent status bar size the page without it, leaving a gap at the bottom. */
            @media (display-mode: standalone), (display-mode: fullscreen) {
                html, body {
                    height: var(--app-height, 100%);
                }
            }
        </style>
        <script>
            // The same iOS bug shortens innerHeight by the status bar, which Cocos sizes its canvas from (the game's
            // right edge while the frame is rotated). The app covers the whole screen, so report the screen's height.
            (function () {
                // iOS scrolls the page, or the body itself while Cocos rotates the frame, to show a focused input and
                // leaves it there after the keyboard closes. The game draws its own text field, so nothing may scroll.
                var ios = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1)
                if (ios) {
                    var unscroll = function () {
                        if (window.scrollX || window.scrollY) window.scrollTo(0, 0)
                        for (var element of [document.documentElement, document.body]) {
                            if (element && (element.scrollTop || element.scrollLeft)) { element.scrollTop = 0; element.scrollLeft = 0 }
                        }
                    }
                    window.addEventListener('scroll', unscroll)
                    document.addEventListener('scroll', unscroll, true)
                }
            })();
            (function () {
                var descriptor = Object.getOwnPropertyDescriptor(window, 'innerHeight')
                if (!navigator.standalone || !descriptor || !descriptor.get) return
                var innerHeight = descriptor.get
                var portrait = window.matchMedia('(orientation: portrait)')
                Object.defineProperty(window, 'innerHeight', { configurable: true, get: function () {
                    var height = innerHeight.call(window)
                    var screenHeight = portrait.matches ? Math.max(screen.width, screen.height) : Math.min(screen.width, screen.height)
                    return Math.max(height, screenHeight)
                } })
                // The page box is shortened the same way, in either orientation; size it to the screen too.
                var fit = function () { document.documentElement.style.setProperty('--app-height', window.innerHeight + 'px') }
                fit()
                window.addEventListener('resize', fit)
            })()
        </script>
    </head>
    <body>
        <div id="GameDiv" cc_exact_fit_screen="true">
            <div id="Cocos3dGameContainer">
                <canvas
                    id="GameCanvas"
                    oncontextmenu="event.preventDefault()"
                    tabindex="99"
                ></canvas>
            </div>
        </div>

        <!-- Polyfills bundle. -->

        <script src="src/polyfills.bundle.js" charset="utf-8"></script>

        <!-- SystemJS support. -->
        <script src="src/system.bundle.js" charset="utf-8"></script>

        <!-- Import map -->
        <script src="src/import-map.json" type="systemjs-importmap" charset="utf-8"></script>

        <script>
            System.import('./index.js').catch(function (err) {
                console.error(err)
            })
        </script>
    </body>
</html>
